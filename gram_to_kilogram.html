<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune's Converter</title>
    <style>
        #display{
            height: 20px;
            width: 500px;
            color: black;
        }

    </style>
</head>
<body>
    <p><h1>Welcome To Gram to Kilogram CONVERTER</h1></p> 
    <div>
        <input id="display" readonly placeholder="Enter a number in grams">
        <div class="keys">
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="calculate('CAL')">CAL</button>

        </div> 


    </div>
    
</body>
<script src="converter-engine.js"></script>
</html>
